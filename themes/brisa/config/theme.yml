parent: hummingbird
name: brisa
display_name: Brisa · Cuidado del hogar
version: 1.0.0
author:
  name: Brisa Studio
meta:
  compatibility:
    from: 9.1.0
    to: ~9.1.0
    framework: bootstrap-v5.3.3
  available_layouts:
    layout-full-width:
      name: Ancho completo
      description: Catálogo sin distracciones
    layout-left-column:
      name: Con filtros
      description: Catálogo con filtros a la izquierda
assets:
  use_parent_assets: true
  css:
    all:
      - id: brisa-style
        path: assets/css/brisa.css
        media: all
        priority: 200
  js:
    all:
      - id: brisa-script
        path: assets/js/brisa.js
        priority: 200
theme_settings:
  default_layout: layout-full-width
  layouts:
    category: layout-left-column
    search: layout-full-width
